<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Param-Tattva v8.0</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    :root {
      --bg: #050505;
      --panel: #0f1115;
      --green: #00ff88;
      --amber: #ffaa00;
      --blue: #00d4ff;
      --red: #ff3366;
      --text: #e0e0e0;
      --dim: #556677;
      --border: rgba(0, 255, 136, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      height: 100%; width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      display: flex; flex-direction: column;
    }

    /* --- Top Stats Header --- */
    #header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 15px;
      display: flex; flex-direction: column; gap: 10px;
      flex-shrink: 0;
    }
    .title-row {
      display: flex; justify-content: space-between; align-items: center;
      color: var(--green); font-size: 16px; font-weight: bold;
      text-shadow: 0 0 5px rgba(0,255,136,0.5);
    }
    .stats-row {
      display: flex; justify-content: space-between;
      font-size: 11px;
    }
    .stat-box {
      background: rgba(0, 255, 136, 0.05);
      border: 1px solid var(--border);
      padding: 5px 8px; border-radius: 4px;
      text-align: center; flex: 1; margin: 0 3px;
    }
    .stat-val { color: var(--green); font-size: 14px; margin-top: 2px; }
    .stat-val.entropy { color: var(--amber); }
    .stat-val.guna { color: var(--blue); }

    /* --- Chat Area --- */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      max-width: 90%;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .msg.user {
      align-self: flex-end;
      background: rgba(0, 212, 255, 0.1);
      border-right: 3px solid var(--blue);
      text-align: right;
    }
    .msg.sys {
      align-self: flex-start;
      background: rgba(0, 255, 136, 0.05);
      border-left: 3px solid var(--green);
    }
    .msg.code {
      align-self: flex-start;
      background: rgba(255, 170, 0, 0.08);
      border-left: 3px solid var(--amber);
    }
    .msg-title { font-size: 10px; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; }

    .chip-container { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { 
      font-size: 9px; padding: 2px 6px; border-radius: 3px; 
      border: 1px solid; background: rgba(255,255,255,0.05); 
    }
    .chip.green { color: var(--green); border-color: var(--green); }
    .chip.amber { color: var(--amber); border-color: var(--amber); }

    /* --- Input Area --- */
    #input-area {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 12px 15px;
      display: flex; gap: 10px;
      flex-shrink: 0;
    }
    #prompt-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--dim);
      color: var(--text);
      padding: 10px;
      border-radius: 5px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    #prompt-input:focus { border-color: var(--green); }
    #send-btn {
      background: rgba(0, 255, 136, 0.1);
      color: var(--green);
      border: 1px solid var(--green);
      padding: 0 15px;
      border-radius: 5px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    #send-btn:active { background: var(--green); color: black; }
  </style>
</head>
<body>

  <!-- Top Header & Live Stats -->
  <div id="header">
    <div class="title-row">
      <span>⚙️ PARAM-TATTVA v8.0</span>
      <span style="font-size:10px; color:var(--dim);">127.0.0.1:8108</span>
    </div>
    <div class="stats-row">
      <div class="stat-box">
        <div>RAM LIMIT</div>
        <div class="stat-val" id="ui-ram">-- Bytes</div>
      </div>
      <div class="stat-box" style="border-color: rgba(255,170,0,0.3);">
        <div>ENTROPY</div>
        <div class="stat-val entropy" id="ui-entropy">--</div>
      </div>
      <div class="stat-box" style="border-color: rgba(0,212,255,0.3);">
        <div>GUNA STATE</div>
        <div class="stat-val guna" id="ui-guna">--</div>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div id="chat-box">
    <div class="msg sys">
      <div class="msg-title">System Status</div>
      C-Kernel Engine Booted.<br>
      Local LLM Bridge on Standby.<br>
      Awaiting your command...
    </div>
  </div>

  <!-- Input Area -->
  <div id="input-area">
    <input type="text" id="prompt-input" placeholder="Type command or code request..." autocomplete="off">
    <button id="send-btn">TX</button>
  </div>

    <script>
    const KERNEL_API = 'http://127.0.0.1:8108'; // For Stats
    const BRIDGE_API = 'http://127.0.0.1:8110'; // For AI Chat
    
    const chatBox = document.getElementById('chat-box');
    const inputField = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');

    // 1. Fetch Real-Time Stats (From C-Kernel directly)
    async function updateStats() {
      try {
        const res = await fetch(`${KERNEL_API}/api/state`, { cache: 'no-store' });
        const data = await res.json();
        document.getElementById('ui-ram').innerText = data.ram + ' Bytes';
        document.getElementById('ui-entropy').innerText = data.entropy;
        let gunaText = "SATTVA";
        if(data.guna == 2) gunaText = "RAJAS";
        if(data.guna == 0) gunaText = "TAMAS";
        document.getElementById('ui-guna').innerText = gunaText;
      } catch (e) {
        console.error("Kernel Offline");
      }
    }
    updateStats();
    setInterval(updateStats, 3000);

    // 2. Messaging System
    function addMessage(type, title, text, chips = []) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${type}`;
      let html = `<div class="msg-title">${title}</div>${text}`;
      if(chips.length > 0) {
        html += `<div class="chip-container">`;
        chips.forEach(c => html += `<span class="chip ${c.color}">${c.text}</span>`);
        html += `</div>`;
      }
      msgDiv.innerHTML = html;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendCommand() {
      const query = inputField.value.trim().toLowerCase(); // Auto lowercase fix
      if (!query) return;

      addMessage('user', 'USER INPUT', inputField.value);
      inputField.value = '';

      const loadId = 'load-' + Date.now();
      const loadDiv = document.createElement('div');
      loadDiv.id = loadId;
      loadDiv.className = 'msg sys';
      loadDiv.innerHTML = 'Scanning request... (Waking up LLM if needed)';
      chatBox.appendChild(loadDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        // Hit the Python Bridge instead of C-Kernel
        const res = await fetch(`${BRIDGE_API}/api/chat?query=${encodeURIComponent(query)}`, { cache: 'no-store' });
        const data = await res.json();
        document.getElementById(loadId).remove();

        if (data.task === "CODE") {
          // Wrap the LLM code in a `<pre>` tag so it looks good
          const formattedCode = `<pre style="background:rgba(0,0,0,0.5); padding:10px; border-radius:5px; margin-top:8px; overflow-x:auto;"><code>${data.llm_response.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>`;
          
          addMessage('code', '⚡ AI ENGINE (LOCAL QWEN)', 
            `Here is the requested output:${formattedCode}`,
            [{text: `HASH: ${data.hash}`, color: 'amber'}, {text: `SPIKE: ${data.spike}`, color: 'amber'}]
          );
        } else {
          addMessage('sys', '🟢 GENERAL MODE (C-KERNEL)', 
            `Concept folded into 1KB Holographic RAM successfully.`,
            [{text: `HASH: ${data.hash}`, color: 'green'}, {text: `SPIKE: ${data.spike}`, color: 'green'}]
          );
        }
        updateStats();
      } catch (err) {
        document.getElementById(loadId).remove();
        addMessage('sys', '❌ FATAL ERROR', 'Connection to Python Bridge lost. Is bridge.py running?', []);
      }
    }

    sendBtn.addEventListener('click', sendCommand);
    inputField.addEventListener('keypress', e => { if (e.key === 'Enter') sendCommand(); });
  </script>

</body>
</html>
